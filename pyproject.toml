[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ramen-foundry"
version = "0.2.8"
description = "LangGraph governance nodes, policy-bound action-gate templates (authorization, eligibility, provenance, industrial, IT) and dataset filtration, powered by ramen-ai."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
dependencies = [
    "ramen-ai-core>=0.3.5,<0.5.0",
    "httpx>=0.27.0,<1.0.0",
    "cryptography>=42.0.0",
    "langgraph==1.2.11",
    "langchain-core==1.6.0",
    "pydantic>=2.10.0,<3.0.0",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
data = [
    "pandas>=2.2.3,<3.0.0",
]
credit-benchmark = [
    "certifi==2026.7.22",
    "numpy==2.2.5",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "shap==0.47.2",
    "xgboost==3.0.5",
]
simulation = [
    "mujoco==3.13.0",
    "imageio==2.37.4",
    "imageio-ffmpeg==0.6.0",
    "pillow==12.3.0",
]

[project.urls]
Homepage = "https://ramenai.dev"
Documentation = "https://ramenai.dev/llms.txt"
Repository = "https://github.com/ramen-ai-dev/ramen-foundry"

[tool.hatch.build.targets.sdist]
# The flagship simulation meshes and textures are about 22 MB. The wheel never
# contained them; keep them out of the sdist too. The tests and CI workflows
# stay in the repository only.
exclude = [
    "examples/assets",
    "recordings",
    "dist",
    "agent_memory.json",
    "tests",
    ".github",
]

[tool.hatch.build.targets.wheel]
packages = ["ramen_foundry"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: serial tests against api.ramenai.dev; opt in with RAMEN_LIVE_TESTS=1 and run with -m live",
]
