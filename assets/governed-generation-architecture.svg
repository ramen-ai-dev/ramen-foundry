<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">ramen-foundry governed generation cascade</title>
  <desc id="desc">A prompt enters ramen-ai governed generation, reaches the provider model, and is semantically evaluated. Content that needs healing loops through governed generation once. Allowed content is released, while retry exhaustion produces no released content.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .box { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 12; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 5; }
      .box-label { font-size: 17px; font-weight: 650; text-anchor: middle; }
      .edge-label { font-size: 15px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="440" rx="18" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="700">Self-correcting governed-generation cascade</text>

  <rect class="box" x="35" y="160" width="150" height="72"/>
  <rect class="box" x="245" y="145" width="210" height="102"/>
  <rect class="box" x="515" y="160" width="170" height="72"/>
  <rect class="box" x="745" y="160" width="190" height="72"/>
  <rect x="995" y="74" width="170" height="72" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <rect x="995" y="286" width="170" height="82" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>

  <text class="box-label" x="110" y="203">Prompt</text>
  <text class="box-label" x="350" y="185">ramen-ai governed</text>
  <text class="box-label" x="350" y="208">generation</text>
  <text x="350" y="230" text-anchor="middle" font-size="14">maximum one healing retry</text>
  <text class="box-label" x="600" y="203">Provider model</text>
  <text class="box-label" x="840" y="203">Semantic evaluation</text>
  <text class="box-label" x="1080" y="104">Verified content</text>
  <text class="box-label" x="1080" y="126">released</text>
  <text class="box-label" x="1080" y="320">Blocked</text>
  <text x="1080" y="344" text-anchor="middle" font-size="15">no content released</text>

  <line class="line" x1="185" y1="196" x2="245" y2="196"/>
  <line class="line" x1="455" y1="196" x2="515" y2="196"/>
  <line class="line" x1="685" y1="196" x2="745" y2="196"/>

  <path class="line" d="M 935 184 C 970 172, 972 110, 995 110"/>
  <text class="edge-label" x="965" y="138" fill="#166534">Allowed</text>

  <path class="line" d="M 935 210 C 970 222, 972 327, 995 327"/>
  <text class="edge-label" x="968" y="272" fill="#9f1239">Retry exhausted</text>

  <path class="line dashed" d="M 840 232 C 840 400, 350 400, 350 247"/>
  <rect x="510" y="376" width="170" height="30" rx="8" fill="#f8fafc"/>
  <text class="edge-label" x="595" y="397">Needs healing</text>
</svg>
