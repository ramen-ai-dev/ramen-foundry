<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">ramen-foundry core engine sequence</title>
  <desc id="desc">A resolved tool invocation travels from the agent through RamenToolNode to the ramen-ai stateless L2 boundary. Only an allowed verdict with a verified Ed25519 receipt reaches the host capability. Denied, unavailable, or unverifiable actions return without execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .participant { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 10; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; }
      .message { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #475569; stroke-width: 2.2; stroke-dasharray: 7 5; fill: none; marker-end: url(#arrow); }
      .label { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .message-label { font-size: 15px; text-anchor: middle; }
      .section-label { font-size: 15px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="740" rx="18" fill="#f8fafc"/>
  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="700">Pre-execution governance boundary</text>

  <rect class="participant" x="35" y="58" width="230" height="58"/>
  <rect class="participant" x="335" y="58" width="230" height="58"/>
  <rect class="participant" x="635" y="58" width="230" height="58"/>
  <rect class="participant" x="935" y="58" width="230" height="58"/>
  <text class="label" x="150" y="93">Agent / LangGraph</text>
  <text class="label" x="450" y="93">RamenToolNode</text>
  <text class="label" x="750" y="82">ramen-ai</text>
  <text class="label" x="750" y="103">stateless L2 boundary</text>
  <text class="label" x="1050" y="93">Host capability</text>

  <line class="lifeline" x1="150" y1="116" x2="150" y2="710"/>
  <line class="lifeline" x1="450" y1="116" x2="450" y2="710"/>
  <line class="lifeline" x1="750" y1="116" x2="750" y2="710"/>
  <line class="lifeline" x1="1050" y1="116" x2="1050" y2="710"/>

  <line class="message" x1="150" y1="160" x2="450" y2="160"/>
  <text class="message-label" x="300" y="150">Resolved ToolInvocation</text>

  <path class="message" d="M 450 205 H 555 V 240 H 458"/>
  <text class="message-label" x="535" y="195">Canonicalize tool + arguments</text>

  <line class="message" x1="450" y1="285" x2="750" y2="285"/>
  <text class="message-label" x="600" y="275">Stateless semantic evaluation</text>

  <line class="return" x1="750" y1="330" x2="450" y2="330"/>
  <text class="message-label" x="600" y="320">Verdict + Ed25519 receipt</text>

  <path class="message" d="M 450 375 H 555 V 410 H 458"/>
  <text class="message-label" x="535" y="365">Verify signature + input binding</text>

  <rect x="315" y="438" width="850" height="116" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text class="section-label" x="335" y="464" fill="#166534">ALLOWED + RECEIPT VERIFIED</text>
  <line class="message" x1="450" y1="493" x2="1050" y2="493"/>
  <text class="message-label" x="750" y="483">Execute registered BaseTool</text>
  <line class="return" x1="1050" y1="530" x2="150" y2="530"/>
  <text class="message-label" x="600" y="520">ToolMessage + Command</text>

  <rect x="35" y="578" width="830" height="104" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text class="section-label" x="55" y="604" fill="#9f1239">DENIED, UNAVAILABLE, OR UNVERIFIABLE</text>
  <line class="return" x1="450" y1="642" x2="150" y2="642"/>
  <text class="message-label" x="300" y="632">Error ToolMessage; capability is not invoked</text>
</svg>
